group = com.github.junkydeveloper.jetbrainsflintplugin
version = 0.0.1

# Build base: IntelliJ IDEA Community 2026.1 (build 261) + JetBrains Rust plugin.
# RustRover ships modular 261 layout the Gradle plugin can't read as a base;
# IDEA + com.jetbrains.rust is the canonical Rust-plugin setup and runs in
# RustRover too (installed RustRover build: RR-261.23567.140182).
platformVersion = 2026.1
rustPluginVersion = 261.23567.140

pluginRepositoryUrl = https://github.com/JunkyDeveloper/jetbrains-flint-plugin

# Opt-out flag for bundling Kotlin standard library -> https://jb.gg/intellij-platform-kotlin-stdlib
kotlin.stdlib.default.dependency = false

# Enable Gradle Configuration Cache -> https://docs.gradle.org/current/userguide/configuration_cache.html
org.gradle.configuration-cache = true

# Enable Gradle Build Cache -> https://docs.gradle.org/current/userguide/build_cache.html
org.gradle.caching = true
